# This semantic cube exposes actor attributes for catalog analysis.
cubes:
  - name: actors
    sql_table: public.actor
    title: Actors
    public: false

    joins:
      - name: film_actors
        relationship: one_to_many
        sql: "{CUBE}.actor_id = {film_actors}.actor_id"

    dimensions:
      - name: actor_id
        sql: actor_id
        type: number
        primary_key: true
        public: false

      - name: actor_name
        sql: "{CUBE}.first_name || ' ' || {CUBE}.last_name"
        type: string
        title: Actor

    measures:
      - name: actor_count
        type: count
        title: Actors

  - name: film_actors
    sql_table: public.film_actor
    title: Film Cast
    description: "Bridge table between films and actors. Never queried directly."
    public: false

    joins:
      - name: actors
        relationship: many_to_one
        sql: "{CUBE}.actor_id = {actors}.actor_id"
      - name: films
        relationship: many_to_one
        sql: "{CUBE}.film_id = {films}.film_id"

    dimensions:
      - name: id
        sql: "{CUBE}.film_id::text || '-' || {CUBE}.actor_id::text"
        type: string
        primary_key: true
        public: false

  - name: languages
    sql_table: public.language
    title: Languages
    public: false

    dimensions:
      - name: language_id
        sql: language_id
        type: number
        primary_key: true
        public: false

      - name: language_name
        sql: "TRIM({CUBE}.name)"
        type: string
        title: Language
