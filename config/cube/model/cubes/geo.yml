# This semantic cube defines the geography dimensions used to group operational data.
cubes:
  - name: addresses
    sql_table: public.address
    title: Addresses
    description: "Postal addresses. Contains PII: phone and street."
    public: false

    joins:
      - name: cities
        relationship: many_to_one
        sql: "{CUBE}.city_id = {cities}.city_id"

    dimensions:
      - name: address_id
        sql: address_id
        type: number
        primary_key: true
        public: false

      - name: street
        sql: address
        type: string
        description: "Street address. PII."
        mask:
          sql: "'*** redacted ***'"

      - name: district
        sql: district
        type: string
        title: District

      - name: postal_code
        sql: postal_code
        type: string
        title: Postal Code

      - name: phone
        sql: phone
        type: string
        description: "Contact phone number. PII."
        mask:
          sql: "'***-***-' || RIGHT({addresses}.phone, 3)"

  - name: cities
    sql_table: public.city
    title: Cities
    public: false

    joins:
      - name: countries
        relationship: many_to_one
        sql: "{CUBE}.country_id = {countries}.country_id"

    dimensions:
      - name: city_id
        sql: city_id
        type: number
        primary_key: true
        public: false

      - name: city_name
        sql: city
        type: string
        title: City

  - name: countries
    sql_table: public.country
    title: Countries
    public: false

    dimensions:
      - name: country_id
        sql: country_id
        type: number
        primary_key: true
        public: false

      - name: country_name
        sql: country
        type: string
        title: Country
