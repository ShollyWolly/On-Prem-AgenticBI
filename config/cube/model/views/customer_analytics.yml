views:
  - name: customer_analytics
    title: Customer Analytics
    description: >
      Customer value and behaviour. Group by customers_customer_id for
      per-customer lifetime value, or by city_name / country_name for cohorts.
      PII (name, e-mail, phone) is masked for the analyst role.

    cubes:
      - join_path: payments
        includes:
          - total_revenue
          - payment_count
          - avg_payment
          - max_payment
          - revenue_per_payment
          - paying_customers
          - paid_at

      - join_path: payments.customers
        prefix: true
        includes:
          - customer_id
          - full_name
          - email
          - is_active
          - created_at
          - customer_count
          - active_customer_count
          - active_customers
          - inactive_customers

      - join_path: payments.customers.addresses
        prefix: true
        includes:
          - phone
          - district
          - postal_code

      - join_path: payments.customers.addresses.cities
        includes:
          - city_name

      - join_path: payments.customers.addresses.cities.countries
        includes:
          - country_name

      - join_path: payments.customers.stores
        includes:
          - store_label

    # View policy controls which members each role can query and which PII values Cube masks.
    access_policy:
      - group: analyst
        member_level:
          excludes:
            - customers_full_name
            - customers_email
            - addresses_phone
        member_masking:
          includes: "*"

      - group: admin
        member_level:
          includes: "*"
