# =============================================================================
#  customer_analytics -- who the customers are and what they are worth.
#  Grain: payment (so revenue measures are correct), pivoted for customer analysis.
#
#  WHY payment GRAIN AND NOT customer GRAIN: lifetime value has to come from the
#  payment fact. A customer-grained view could only count customers, not sum
#  money. Grouping this view by customers_customer_id gives per-customer revenue;
#  grouping by city/country gives cohort views.
#
#  ACCESS POLICY IS MANDATORY ON EVERY VIEW. Cube does not inherit member-level
#  policies from cubes, so a view shipped without a policy exposes every member in
#  the clear to every group. This is the single easiest way to open a hole.
# =============================================================================
views:
  - name: customer_analytics
    title: Customer Analytics
    description: >
      Customer value and behaviour. Group by customers_customer_id for
      per-customer lifetime value, or by city_name / country_name for cohorts.
      PII (name, e-mail, phone) is masked for the analyst role.

    cubes:
      - join_path: payments
        includes:
          - total_revenue
          - payment_count
          - avg_payment
          - max_payment
          - revenue_per_payment
          - paying_customers
          - paid_at

      - join_path: payments.customers
        prefix: true
        includes:
          - customer_id
          - full_name
          - email
          - is_active
          - created_at
          - customer_count
          - active_customer_count
          # Segments must be included explicitly to be usable through the view.
          - active_customers
          - inactive_customers

      - join_path: payments.customers.addresses
        prefix: true
        includes:
          - phone
          - district
          - postal_code

      - join_path: payments.customers.addresses.cities
        includes:
          - city_name

      - join_path: payments.customers.addresses.cities.countries
        includes:
          - country_name

      - join_path: payments.customers.stores
        includes:
          - store_label

    access_policy:
      - group: analyst
        member_level:
          excludes:
            - customers_full_name
            - customers_email
            - addresses_phone
        member_masking:
          includes: "*"

      - group: admin
        member_level:
          includes: "*"
