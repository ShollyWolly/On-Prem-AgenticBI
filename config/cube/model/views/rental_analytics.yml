# =============================================================================
#  rental_analytics -- volume and duration. Grain: rental.
#
#  Separate from revenue_analytics because rental_date and payment_date are
#  independent distributions in this data (see model/cubes/facts.yml). Keeping
#  them apart holds every measure at its natural grain and avoids fanning out
#  SUM(amount) across rentals.
#
#  Do NOT build a continuous line chart on rented_at: the source data has two
#  consecutive months with zero rentals and it renders as a gap. Bar charts by
#  category/rating/store are fine.
#
#  Policy placement is identical to revenue_analytics -- see the long comment
#  there for why member_level/member_masking must live on the view.
# =============================================================================
views:
  - name: rental_analytics
    title: Rental Analytics
    description: >
      Rental-grained volume and duration fact with customer, geography, store
      and film attributes. Use this for rental counts, open rentals and average
      rental duration. For revenue, use revenue_analytics instead.

    cubes:
      - join_path: rentals
        includes:
          - rental_count
          - distinct_customers
          - avg_rental_duration_days
          - open_rentals
          - rented_at
          - returned_at
          - is_returned

      - join_path: rentals.customers
        prefix: true
        includes:
          - customer_id
          - full_name
          - email
          - is_active

      - join_path: rentals.customers.addresses
        prefix: true
        includes:
          - phone
          - district

      # See revenue_analytics for why prefix: true is used sparingly.
      - join_path: rentals.customers.addresses.cities
        includes:
          - city_name

      - join_path: rentals.customers.addresses.cities.countries
        includes:
          - country_name

      - join_path: rentals.staff
        includes:
          - staff_name
          - staff_email

      - join_path: rentals.inventory.films
        includes:
          - title
          - rating
          - release_year
          - film_length_minutes

      - join_path: rentals.inventory.films.film_primary_categories.categories
        includes:
          - category_name

      - join_path: rentals.inventory.stores
        includes:
          - store_label

    access_policy:
      - group: analyst
        member_level:
          excludes:
            - customers_full_name
            - customers_email
            - addresses_phone
            - staff_name
            - staff_email
        member_masking:
          includes: "*"

      - group: admin
        member_level:
          includes: "*"
