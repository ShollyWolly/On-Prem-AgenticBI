# This admin-only view collection exposes registered raw Pagila tables through Cube policies.
views:
  - name: raw_actor
    title: Raw Actor Table
    description: "Administrator-only Pagila actor source table."
    cubes: [{ join_path: raw_source_actor, includes: "*" }]
    access_policy: [{ group: admin, member_level: { includes: "*" } }]

  - name: raw_address
    title: Raw Address Table
    description: "Administrator-only Pagila address source table."
