# This view presents payment-based revenue metrics without exposing direct warehouse tables.
views:
  - name: revenue_analytics
    title: Revenue Analytics
    description: >
      Payment-grained revenue fact with customer, geography, store, staff and
      film attributes. Use this for all revenue and payment questions.
      Customer e-mail and name, staff name and e-mail, and phone are masked for
      the analyst role.

    cubes:
      - join_path: payments
        includes:
          - total_revenue
          - payment_count
          - avg_payment
          - paying_customers
          - paid_at

      - join_path: payments.customers
        prefix: true
        includes:
          - customer_id
          - full_name
          - email
          - is_active

      - join_path: payments.customers.addresses
        prefix: true
        includes:
          - phone
          - district
          - postal_code

      - join_path: payments.customers.addresses.cities
        includes:
          - city_name

      - join_path: payments.customers.addresses.cities.countries
        includes:
          - country_name

      - join_path: payments.staff
        includes:
          - staff_name
          - staff_email

      - join_path: payments.staff.stores
        includes:
          - store_label

      - join_path: payments.rentals.inventory.films
        includes:
          - title
          - rating
          - release_year

      - join_path: payments.rentals.inventory.films.film_primary_categories.categories
        includes:
          - category_name

    # View policy controls which members each role can query and which PII values Cube masks.
    access_policy:
      - group: analyst
        member_level:
          excludes:
            - customers_full_name
            - customers_email
            - addresses_phone
            - staff_name
            - staff_email
        member_masking:
          includes: "*"

      - group: admin
        member_level:
          includes: "*"
