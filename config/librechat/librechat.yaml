version: 1.3.0
cache: true

mcpSettings:
  allowedAddresses:
    - "cube-mcp:8000"
    - "cube-sql-mcp:8000"
    - "superset-mcp:5008"
    - "authentik.localhost:9000"

mcpServers:
  cube:
    type: streamable-http
    url: "http://cube-mcp:8000/mcp"
    oauth:
      client_id: "cube-mcp"
      authorization_url: "http://authentik.localhost:9000/application/o/authorize/"
      token_url: "http://authentik.localhost:9000/application/o/token/"
      scope: "openid profile email cube.read"
    timeout: 120000
    initTimeout: 45000
    chatMenu: false
    serverInstructions: |
      You are querying a governed Cube.dev semantic layer. Authenticate to this
      MCP when LibreChat asks; Authentik SSO makes the consent flow user-specific.

      First call get_schema, then query with a structured Cube REST query object.
      Use the semantic view/member names returned by get_schema; never invent raw
      SQL, joins, CTEs, table names, or an identity/role argument. Query one view
      at a time. Use measures, dimensions, filters, timeDimensions, order, limit,
      and timezone as needed. Call whoami only when explaining policy effects.

      Governance is server-side. The authenticated user's LDAP group controls the
      result. Some columns are masked for analysts; do not try to reconstruct,
      infer, or bypass masked values.

  cube_sql:
    type: streamable-http
    url: "http://cube-sql-mcp:8000/mcp"
    oauth:
      client_id: "cube-mcp"
      authorization_url: "http://authentik.localhost:9000/application/o/authorize/"
      token_url: "http://authentik.localhost:9000/application/o/token/"
      scope: "openid profile email cube.read"
    timeout: 120000
    initTimeout: 45000
    chatMenu: false
    serverInstructions: |
      You are querying the governed Cube.dev semantic layer through Semantic SQL.
      Authenticate to this MCP when LibreChat asks; Authentik SSO makes the
      connection user-specific.

      First call get_schema, then use query_sql with one read-only Semantic SQL
      query. Query only the views returned by get_schema and use Cube's MEASURE()
      function for metrics. Prefer an explicit LIMIT for exploratory or row-level
      queries because the server does not add one. Never use warehouse tables,
      credentials, roles, or identity arguments. The server enforces governance.

      Some columns are masked for analysts; do not try to reconstruct, infer, or
      bypass masked values.

  superset:
    type: streamable-http
    url: "http://superset-mcp:5008/mcp"
    startup: true
    timeout: 120000
    initTimeout: 45000
    chatMenu: true
    serverInstructions: |
      You are inspecting an Apache Superset instance through its MCP service, to
      analyse dashboards and charts that already exist.

      Normal path: list_dashboards -> get_dashboard_info -> get_chart_info ->
      get_chart_data. `get_chart_data` returns the actual ROWS behind a chart,
      which is what you should reason over -- never guess numbers from a title.

      Every tool here takes ONE argument, an object called `request`, with the real
      arguments nested inside it: {"request": {"identifier": 10}}. Charts and
      dashboards are addressed by `identifier` (id, uuid or slug), not by
      `chart_id` / `dashboard_id`. Flat arguments fail validation and are reported
      back as "Internal error ... contact support", which is not the real cause.

      `limit` on get_chart_data REPLACES the chart's own row limit rather than
      capping it -- chart 10 returns 15 rows with no limit and 100 rows with
      limit=100. So call it with `identifier` alone whenever the row count itself
      matters, or you will measure your own argument and mistake it for a defect.

      DO NOT CALL:
          browser, and this deployment has neither. They will fail.
          update_chart / add_chart_to_existing_dashboard / create_virtual_dataset
          ANALYSE, not to author.

      Responses are size-capped (25k tokens, default page size 10). If a result is
      blocked as too large, reduce page_size or select fewer columns rather than
      retrying the same call.

      Note the dashboard's underlying data comes from a governed semantic layer, so
      some columns may be masked (e.g. e-mail as ***@domain). That is intentional;
      report it as masked rather than treating it as bad data.

endpoints:
  custom:
    - name: "Azure Foundry"
      apiKey: "${AZURE_FOUNDRY_API_KEY}"
      baseURL: "${AZURE_FOUNDRY_BASE_URL}"
      models:
        default: ["gpt-5-mini"]
        fetch: false
      titleConvo: true
      modelDisplayLabel: "Azure Foundry"
      dropParams: ["user", "frequency_penalty", "presence_penalty"]

  agents:
    recursionLimit: 40
    maxRecursionLimit: 80
    disableBuilder: false
    capabilities:
      - "execute_code"
      - "tools"
      - "artifacts"
      - "programmatic_tools"
      - "file_search"
      - "actions"

interface:
  mcpServers:
    placeholder: "Cube Semantic Layer"
