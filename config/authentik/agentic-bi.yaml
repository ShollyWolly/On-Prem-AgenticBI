version: 1

metadata:
  name: Agentic BI LDAP SSO and Cube MCP OAuth
  labels:
    blueprints.goauthentik.io/description: LDAP-backed SSO for LibreChat and Cube MCP

entries:
  # LDAP remains the source of truth for the groups used by application authorization.
  - model: authentik_sources_ldap.ldapsource
    identifiers:
      slug: agentic-bi-ldap
    attrs:
      name: Agentic BI OpenLDAP
      enabled: true
      server_uri: ldap://openldap:389
      base_dn: !Env LDAP_BASE_DN
      bind_cn: !Env LDAP_ADMIN_DN
      bind_password: !Env LDAP_ADMIN_PASSWORD
      additional_user_dn: ou=people
      additional_group_dn: ou=groups
      user_object_filter: (objectClass=inetOrgPerson)
      group_object_filter: (objectClass=groupOfUniqueNames)
      group_membership_field: uniqueMember
      user_membership_attribute: distinguishedName
      lookup_groups_from_user: false
      object_uniqueness_field: entryUUID
      sync_users: true
      sync_groups: true
      delete_not_found_objects: true
      user_property_mappings:
        - !Find [authentik_sources_ldap.ldapsourcepropertymapping, [managed, goauthentik.io/sources/ldap/openldap-cn]]
        - !Find [authentik_sources_ldap.ldapsourcepropertymapping, [managed, goauthentik.io/sources/ldap/openldap-uid]]
        - !Find [authentik_sources_ldap.ldapsourcepropertymapping, [managed, goauthentik.io/sources/ldap/default-mail]]
        - !Find [authentik_sources_ldap.ldapsourcepropertymapping, [managed, goauthentik.io/sources/ldap/default-dn-path]]
        - !Find [authentik_sources_ldap.ldapsourcepropertymapping, [managed, goauthentik.io/sources/ldap/default-name]]
      group_property_mappings:
        - !Find [authentik_sources_ldap.ldapsourcepropertymapping, [managed, goauthentik.io/sources/ldap/openldap-cn]]

  - model: authentik_providers_oauth2.scopemapping
    id: cube-read-scope
    identifiers:
      name: Agentic BI Cube MCP read scope
    attrs:
      name: Agentic BI Cube MCP read scope
      scope_name: cube.read
      description: Read governed Cube semantic data through the MCP resource server
      # This scope grants MCP access while Cube still enforces the user's role.
      expression: |
        return {}

  - model: authentik_providers_oauth2.oauth2provider
    id: librechat-provider
    identifiers:
      name: LibreChat OIDC
    attrs:
      name: LibreChat OIDC
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: confidential
      client_id: librechat
      client_secret: !Env AUTHENTIK_LIBRECHAT_CLIENT_SECRET
      grant_types:
        - authorization_code
        - refresh_token
      redirect_uris:
        - matching_mode: strict
          url: http://localhost:3080/oauth/openid/callback
      include_claims_in_id_token: true
      issuer_mode: per_provider
      sub_mode: hashed_user_id
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-offline_access]]

  - model: authentik_core.application
    identifiers:
      slug: librechat
    attrs:
      name: LibreChat
      slug: librechat
      provider: !KeyOf librechat-provider
      policy_engine_mode: any

  - model: authentik_providers_oauth2.oauth2provider
    id: cube-mcp-provider
    identifiers:
      name: Cube MCP OAuth
    attrs:
      name: Cube MCP OAuth
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      # Local MCP clients complete this user-facing OAuth flow without a client secret.
      client_type: public
      client_id: cube-mcp
      grant_types:
        - authorization_code
        - refresh_token
      redirect_uris:
        - matching_mode: regex
          url: ^http://(localhost|127\\.0\\.0\\.1):[0-9]+/.*$
      include_claims_in_id_token: true
      issuer_mode: per_provider
      sub_mode: hashed_user_id
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Internal JWT Certificate]]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, cube.read]]

  - model: authentik_core.application
    identifiers:
      slug: cube-mcp
    attrs:
      name: Cube Semantic Layer MCP
      slug: cube-mcp
      provider: !KeyOf cube-mcp-provider
      policy_engine_mode: any
