name: agentic-bi


x-superset-image: &superset-image
  build:
    context: ./docker/superset
  image: abi/superset:6.1.0-psycopg2

x-superset-env-file: &superset-env-file
  - ./config/superset/.env

x-superset-volumes: &superset-volumes
  - ./config/superset/superset_config.py:/app/pythonpath/superset_config.py:ro
  - ./config/superset/assets:/app/assets:ro
  - ./config/superset/build_dashboard.py:/app/build_dashboard.py:ro
  - ./config/superset/create_mcp_reader.py:/app/create_mcp_reader.py:ro
  - ./config/superset/align_ldap_usernames.py:/app/align_ldap_usernames.py:ro
  - superset_home:/app/superset_home

services:

  openldap:
    image: osixia/openldap:1.5.0
    container_name: abi-openldap
    env_file:
      - ./config/ldap/.env
    environment:
      LDAP_TLS: "false"
      LDAP_REMOVE_CONFIG_AFTER_SETUP: "true"
    volumes:
      - ldap_data:/var/lib/ldap
      - ldap_config:/etc/ldap/slapd.d
    healthcheck:
      test:
        - CMD
        - ldapsearch
        - -x
        - -H
        - ldap://localhost
        - -b
        - ""
        - -s
        - base
        - namingContexts
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s
    networks: [abi]
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:0.8.1-pg17-bookworm
    container_name: abi-postgres
    env_file:
      - ./config/postgres/.env
    environment:
      TZ: UTC
      PGTZ: UTC
      LANG: C.UTF-8
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./config/postgres/initdb.d:/docker-entrypoint-initdb.d:ro
    ports:
      - "${POSTGRES_HOST_PORT:-55432}:5432"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          pg_isready -h 127.0.0.1 -p 5432 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -q &&
          psql -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -tAc
          'select 1 from public.seed_complete' | grep -q 1
      interval: 5s
      timeout: 10s
      retries: 60
      start_period: 60s
    networks: [abi]
    restart: unless-stopped

  # Cube REST stays on the internal network and accepts only gateway-issued tokens.
  cube:
    image: cubejs/cube:v1.6.70
    container_name: abi-cube
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ./config/cube/env/common.env
      - ./config/cube/env/${CUBE_MODE:-demo}.env
      - ./config/cube/env/.env
    environment:
      CUBEJS_DB_TYPE: postgres
      CUBEJS_DB_HOST: postgres
      CUBEJS_DB_PORT: "5432"
    volumes:
      - ./config/cube/model:/cube/conf/model:ro
      - ./config/cube/cube.js:/cube/conf/cube.js:ro
    ports:
      - "${CUBE_PG_HOST_PORT:-15432}:15432"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          require('http').get('http://127.0.0.1:4000/readyz',
          r => process.exit(r.statusCode === 200 ? 0 : 1))
          .on('error', () => process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks: [abi]
    restart: unless-stopped

  cubestore:
    image: cubejs/cubestore:v1.6.70
    container_name: abi-cubestore
    profiles: [cubestore]
    environment:
      CUBESTORE_SERVER_NAME: cubestore:9999
      CUBESTORE_META_PORT: "9999"
      CUBESTORE_PORT: "3030"
      CUBESTORE_REMOTE_DIR: /cube/data
    volumes:
      - cubestore_data:/cube/data
    networks: [abi]
    restart: unless-stopped

  superset:
    <<: *superset-image
    container_name: abi-superset
    depends_on:
      postgres:
        condition: service_healthy
      cube:
        condition: service_healthy
      openldap:
        condition: service_healthy
    env_file: *superset-env-file
    volumes: *superset-volumes
    entrypoint: ["/bin/bash", "-euo", "pipefail", "-c"]
    command:
      - |
        echo "-- 1/8 metadata schema migration --"
        superset db upgrade

        echo "-- 2/8 admin user (idempotent) --"
        superset fab create-admin \
          || echo "   admin already exists - continuing"

        echo "-- 3/8 roles and permissions --"
        superset init

        echo "-- 4/8 render asset bundle --"
        rm -rf /tmp/assets && cp -r /app/assets /tmp/assets
        sed -i "s#__CUBE_SQLALCHEMY_URI__#postgresql+psycopg2://$${CUBE_SQL_USER}:$${CUBE_SQL_PASSWORD}@cube:15432/cube#" \
          /tmp/assets/databases/cube.yaml

        echo "-- 5/8 import database + datasets --"
        superset import-directory /tmp/assets -o

        echo "-- 6/8 align usernames to e-mail (required by AUTH_LDAP) --"
        python /app/align_ldap_usernames.py

        echo "-- 7/8 read-only MCP service account --"
        python /app/create_mcp_reader.py

        echo "-- 8/8 build charts + dashboard --"
        python /app/build_dashboard.py

        echo "-- provisioning complete, starting web server --"
        exec /usr/bin/run-server.sh
    ports:
      - "${SUPERSET_HOST_PORT:-8088}:8088"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8088/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 600s
    networks: [abi]
    restart: unless-stopped

  authentik-postgresql:
    image: postgres:16.9-alpine
    container_name: abi-authentik-postgresql
    profiles: [chat]
    env_file:
      - ./config/authentik/postgres.env
    volumes:
      - authentik_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U authentik -d authentik -q"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [abi]
    restart: unless-stopped

  authentik-redis:
    image: redis:7.4.7-alpine
    container_name: abi-authentik-redis
    profiles: [chat]
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - authentik_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [abi]
    restart: unless-stopped

  authentik-server:
    image: ghcr.io/goauthentik/server:2026.5.5
    container_name: abi-authentik-server
    profiles: [chat]
    command: server
    depends_on:
      authentik-postgresql:
        condition: service_healthy
      authentik-redis:
        condition: service_healthy
      openldap:
        condition: service_healthy
    env_file: &authentik-env-file
      - ./config/authentik/.env
    environment: &authentik-env
      AUTHENTIK_REDIS__HOST: authentik-redis
      AUTHENTIK_POSTGRESQL__HOST: authentik-postgresql
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
      AUTHENTIK_DISABLE_UPDATE_CHECK: "true"
    volumes:
      - ./config/authentik:/blueprints/agentic-bi:ro
      - authentik_media:/media
      - authentik_templates:/templates
    ports:
      - "${AUTHENTIK_HOST_PORT:-9000}:9000"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          ak healthcheck >/dev/null 2>&1 &&
          curl --fail --silent --show-error
          http://127.0.0.1:9000/application/o/librechat/.well-known/openid-configuration
          >/dev/null
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 60s
    networks: [abi]
    restart: unless-stopped

  authentik-worker:
    image: ghcr.io/goauthentik/server:2026.5.5
    container_name: abi-authentik-worker
    profiles: [chat]
    command: worker
    depends_on:
      authentik-server:
        condition: service_started
    env_file: *authentik-env-file
    environment: *authentik-env
    volumes:
      - ./config/authentik:/blueprints/agentic-bi:ro
      - authentik_media:/media
      - authentik_templates:/templates
    networks: [abi]
    restart: unless-stopped

  # This is the sole OAuth-protected route from agents to the Cube semantic layer.
  cube-mcp:
    build:
      context: ./docker/cube-mcp
    image: abi/cube-mcp:local
    container_name: abi-cube-mcp
    profiles: [chat]
    depends_on:
      cube:
        condition: service_healthy
      authentik-server:
        condition: service_healthy
    env_file:
      - ./config/cube-mcp/.env
    environment:
      CUBE_API_URL: http://cube:4000/cubejs-api/v1
      AUTHENTIK_CUBE_ISSUER: http://authentik.localhost:${AUTHENTIK_HOST_PORT:-9000}/application/o/cube-mcp/
      AUTHENTIK_CUBE_JWKS_URL: http://authentik.localhost:${AUTHENTIK_HOST_PORT:-9000}/application/o/cube-mcp/jwks/
      CUBE_MCP_PUBLIC_URL: http://cube-mcp:8000
    extra_hosts:
      - "authentik.localhost:host-gateway"
    expose: ["8000"]
    ports:
      - "${CUBE_MCP_HOST_PORT:-8003}:8000"
    networks: [abi]
    restart: unless-stopped

  cube-sql-mcp:
    build:
      context: ./docker/cube-sql-mcp
    image: abi/cube-sql-mcp:local
    container_name: abi-cube-sql-mcp
    profiles: [chat]
    depends_on:
      cube:
        condition: service_healthy
      authentik-server:
        condition: service_healthy
    env_file:
      - ./config/cube-sql-mcp/.env
    environment:
      CUBE_SQL_HOST: cube
      CUBE_SQL_PORT: "15432"
      CUBE_SQL_DATABASE: cube
      CUBE_API_URL: http://cube:4000/cubejs-api/v1
      AUTHENTIK_CUBE_ISSUER: http://authentik.localhost:${AUTHENTIK_HOST_PORT:-9000}/application/o/cube-mcp/
      AUTHENTIK_CUBE_JWKS_URL: http://authentik.localhost:${AUTHENTIK_HOST_PORT:-9000}/application/o/cube-mcp/jwks/
      CUBE_SQL_MCP_PUBLIC_URL: http://cube-sql-mcp:8000
    extra_hosts:
      - "authentik.localhost:host-gateway"
    expose: ["8000"]
    ports:
      - "${CUBE_SQL_MCP_HOST_PORT:-8004}:8000"
    networks: [abi]
    restart: unless-stopped

  mongodb:
    image: mongo:8.0.20
    container_name: abi-mongodb
    profiles: [chat]
    command: mongod --noauth
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks: [abi]
    restart: unless-stopped

  rag-api:
    build:
      context: ./vendor/rag_api
      dockerfile: ../../docker/rag-api/Dockerfile
    image: abi/rag-api:0.8.0
    container_name: abi-rag-api
    profiles: [chat]
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ./config/rag-api/.env
    environment:
      RAG_PORT: "8000"
      RAG_HOST: 0.0.0.0
      DB_HOST: postgres
      DB_PORT: "5432"
      EMBEDDINGS_PROVIDER: huggingface
      EMBEDDINGS_MODEL: sentence-transformers/all-MiniLM-L6-v2
      HF_HOME: /app/hf
      SENTENCE_TRANSFORMERS_HOME: /app/hf
    volumes:
      - ragmodels:/app/hf
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request,sys;
          sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=5).status==200 else 1)
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 300s
    networks: [abi]
    restart: unless-stopped

  librechat:
    build:
      context: ./vendor/LibreChat
      dockerfile: ../../docker/librechat/Dockerfile
    image: abi/librechat:v0.8.7
    container_name: abi-librechat
    profiles: [chat]
    depends_on:
      mongodb:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
      cube-mcp:
        condition: service_started
      cube-sql-mcp:
        condition: service_started
      rag-api:
        condition: service_healthy
      authentik-server:
        condition: service_healthy
    env_file:
      - ./config/librechat/.env
    environment:
      RAG_API_URL: http://rag-api:8000
      NODE_OPTIONS: --dns-result-order=ipv4first
      OPENID_ISSUER: http://authentik.localhost:${AUTHENTIK_HOST_PORT:-9000}/application/o/librechat/
      OPENID_SCOPE: "openid profile email offline_access"
      OPENID_CALLBACK_URL: /oauth/openid/callback
      OPENID_EMAIL_CLAIM: email
      OPENID_NAME_CLAIM: name
      OPENID_AUTO_REDIRECT: "true"
      OPENID_USE_PKCE: "false"
      OPENID_USE_END_SESSION_ENDPOINT: "true"
      LIBRECHAT_CODE_BASEURL: http://codeapi:3112/v1
      CODEAPI_AUTH_PROVIDER: none
      AGENTIC_BI_CONFIG_DIR: /app/agentic-bi-config
    volumes:
      - ./config/librechat/librechat.yaml:/app/librechat.yaml:ro
      - ./config/librechat:/app/agentic-bi-config:ro
      - ./vendor/LibreChat/api/server:/app/api/server
      - ./vendor/LibreChat/api/app:/app/api/app
      - ./vendor/LibreChat/api/models:/app/api/models
      - ./vendor/LibreChat/api/utils:/app/api/utils
      - ./vendor/LibreChat/api/strategies:/app/api/strategies
      - ./vendor/LibreChat/api/db:/app/api/db
      - ./vendor/LibreChat/api/cache:/app/api/cache
      - librechat_images:/app/client/public/images
      - librechat_uploads:/app/uploads
      - librechat_logs:/app/logs
    extra_hosts:
      - "authentik.localhost:host-gateway"
    ports:
      - "${LIBRECHAT_HOST_PORT:-3080}:3080"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "require('http').get('http://127.0.0.1:3080/health',
          r => process.exit(r.statusCode < 500 ? 0 : 1))
          .on('error', () => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 40
      start_period: 60s
    networks: [abi]
    restart: unless-stopped

  meilisearch:
    image: getmeili/meilisearch:v1.35.1
    container_name: abi-meilisearch
    profiles: [chat]
    env_file:
      - ./config/meilisearch/.env
    volumes:
      - meilisearch_data:/meili_data
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --spider http://127.0.0.1:7700/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks: [abi]
    restart: unless-stopped

  superset-mcp:
    <<: *superset-image
    container_name: abi-superset-mcp
    profiles: [chat]
    depends_on:
      postgres:
        condition: service_healthy
      superset:
        condition: service_healthy
    env_file: *superset-env-file
    volumes: *superset-volumes
    entrypoint: ["/bin/bash", "-euo", "pipefail", "-c"]
    command:
      - |
        echo "-- starting Superset MCP service on :5008 --"
        exec superset mcp run --host 0.0.0.0 --port 5008
    expose: ["5008"]
    ports:
      - "${SUPERSET_MCP_HOST_PORT:-5008}:5008"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:5008/mcp
          | grep -qE '^(200|400|405|406)$$'
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s
    networks: [abi]
    restart: unless-stopped


  garage:
    image: dxflrs/garage:v2.3.0
    container_name: abi-garage
    profiles: [sandbox]
    env_file:
      - ./config/sandbox/.env
    volumes:
      - ./config/garage/garage.toml:/etc/garage.toml:ro
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data
    expose:
      - "3900"
      - "3903"
    healthcheck:
      test: ["CMD", "/garage", "-c", "/etc/garage.toml", "status"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 20s
    networks: [abi]
    restart: unless-stopped

  codeapi-redis:
    image: redis:7-alpine
    container_name: abi-codeapi-redis
    profiles: [sandbox]
    env_file:
      - ./config/sandbox/.env
    command: ["/bin/sh", "-c", "exec redis-server --requirepass \"$$CODEAPI_REDIS_PASSWORD\""]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$CODEAPI_REDIS_PASSWORD\" ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [abi]
    restart: unless-stopped

  codeapi-files:
    build:
      context: ./vendor/code-interpreter
      dockerfile: service/Dockerfile
      target: production
    image: abi/codeapi-files:latest
    container_name: abi-codeapi-files
    profiles: [sandbox]
    depends_on:
      garage:
        condition: service_healthy
      codeapi-redis:
        condition: service_healthy
    env_file:
      - ./config/sandbox/.env
    environment:
      FILE_SERVER_PORT: "3000"
      REDIS_HOST: codeapi-redis
      REDIS_PORT: "6379"
    expose:
      - "3000"
    networks: [abi]
    restart: unless-stopped

  codeapi-toolcall:
    build:
      context: ./vendor/code-interpreter
      dockerfile: service/Dockerfile.tool-call-server
      target: production
    image: abi/codeapi-toolcall:latest
    container_name: abi-codeapi-toolcall
    profiles: [sandbox]
    depends_on:
      codeapi-redis:
        condition: service_healthy
    env_file:
      - ./config/sandbox/.env
    environment:
      TOOL_CALL_SERVER_PORT: "3033"
      TOOL_CALL_REQUEST_TIMEOUT: "300000"
      TOOL_CALL_SESSION_EXPIRY: "600"
      REDIS_HOST: codeapi-redis
      REDIS_PORT: "6379"
    expose:
      - "3033"
    networks: [abi]
    restart: unless-stopped

  codeapi-sandbox:
    build:
      context: ./vendor/code-interpreter
      dockerfile: api/Dockerfile
      target: sandbox-build
    image: abi/codeapi-sandbox:latest
    container_name: abi-codeapi-sandbox
    profiles: [sandbox]
    entrypoint: ["/sandbox_api/entrypoint.sh"]
    privileged: false
    devices:
      - /dev/null:/dev/kvm
    security_opt:
      - seccomp=./vendor/code-interpreter/seccomp/nsjail.json
    cap_add:
      - SYS_ADMIN
      - SYS_CHROOT
      - SYS_PTRACE
      - SETUID
      - SETGID
      - NET_ADMIN
      - DAC_OVERRIDE
      - DAC_READ_SEARCH
      - CHOWN
      - FOWNER
      - FSETID
      - KILL
      - SETFCAP
      - MKNOD
    volumes:
      - codeapi_pkgs:/pkgs:ro
    env_file:
      - ./config/sandbox/.env
    environment:
      KVM_ENABLED: "false"
      SANDBOX_USE_CGROUPV2: "false"
      SANDBOX_REMOVE_UMOUNT_AFTER_STARTUP: "false"
      SANDBOX_PACKAGES_DIRECTORY: /pkgs
      SANDBOX_LOG_LEVEL: INFO
      SANDBOX_MAX_PROCESS_COUNT: "100"
      SANDBOX_PER_JOB_UIDS: "true"
      SANDBOX_JOB_UID_BASE: "200000"
      SANDBOX_JOB_GID_BASE: "200000"
      SANDBOX_WORKSPACE_REAPER_MAX_AGE_SECONDS: "3600"
      SANDBOX_RUN_CPU_TIME: "60000"
      SANDBOX_RUN_TIMEOUT: "300000"
      SANDBOX_OUTPUT_MAX_SIZE: "65536"
      SANDBOX_DISABLE_NETWORKING: "true"
      SANDBOX_ALLOWED_LOCAL_NETWORK_PORT: "3033"
      SANDBOX_FORWARD_TARGET: codeapi-toolcall:3033
      FILE_SERVER_URL: http://codeapi-files:3000
    depends_on:
      codeapi-toolcall:
        condition: service_started
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bun -e "fetch('http://localhost:2000/api/v2/runtimes').then(r =>
          process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 30s
    networks: [abi]
    restart: unless-stopped

  codeapi:
    build:
      context: ./vendor/code-interpreter
      dockerfile: service/Dockerfile.local
      target: production
    image: abi/codeapi:latest
    container_name: abi-codeapi
    profiles: [sandbox]
    depends_on:
      codeapi-redis:
        condition: service_healthy
      codeapi-sandbox:
        condition: service_healthy
      codeapi-files:
        condition: service_started
      codeapi-toolcall:
        condition: service_started
    env_file:
      - ./config/sandbox/.env
    environment:
      LOCAL_MODE: "true"
      PORT: "3112"
      SANDBOX_ENDPOINT: http://codeapi-sandbox:2000/api/v2
      FILE_SERVER_URL: http://codeapi-files:3000
      TOOL_CALL_SERVER_URL: http://codeapi-toolcall:3033
      REDIS_HOST: codeapi-redis
      REDIS_PORT: "6379"
      PYTHON_CONCURRENCY: "1"
      OTHER_CONCURRENCY: "8"
      JOB_WINDOW: "1000"
      JOB_TIMEOUT: "300000"
    ports:
      - "${CODEAPI_HOST_PORT:-3112}:3112"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bun -e "fetch('http://localhost:3112/v1/health').then(r =>
          process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks: [abi]
    restart: unless-stopped

networks:
  abi:
    name: agentic-bi
    driver: bridge

volumes:
  pgdata:
  superset_home:
  cubestore_data:
  mongo_data:
  authentik_postgres_data:
  authentik_redis_data:
  authentik_media:
  authentik_templates:
  ldap_data:
  ldap_config:
  garage_meta:
  garage_data:
  ragmodels:
  codeapi_pkgs:
    name: agentic-bi_codeapi_pkgs
    external: true
  librechat_images:
  librechat_uploads:
  librechat_logs:
  meilisearch_data:
